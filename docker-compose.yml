services:
  postgres:
    image: postgres:16-alpine
    container_name: gyanwire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gyanwire
      POSTGRES_PASSWORD: gyanwire
      POSTGRES_DB: gyanwire
    ports:
      - "5433:5432"
    volumes:
      - gyanwire_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyanwire -d gyanwire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gyanwire_pg_data:
