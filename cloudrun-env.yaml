# Non-secret Cloud Run env vars for Gyanwire (Spring Boot gyanwire-server).
# Secrets come from Secret Manager via cloudbuild.yaml --set-secrets.
#
# Firebase Hosting (web.app) and Cloud Run (run.app) are different sites.
# Cross-origin credentialed fetch needs SameSite=None + Secure + Partitioned (CHIPS).
# Lax works only for same-site (local). AuthCookieService sets Partitioned when SameSite=None.
# After first deploy, set UI_ORIGIN to the Firebase URL if cookies/CORS need it.

APP_PERSISTENCE_PROVIDER: postgres
AUTH_COOKIE_SECURE: "true"
AUTH_COOKIE_SAME_SITE: None
AUTH_COOKIE_PARTITIONED: "true"
UI_ORIGIN: https://gyanwire-a4293.web.app
JWT_ACCESS_TTL_SECONDS: "43200"
JWT_REFRESH_TTL_SECONDS: "2592000"
LLM_BASE_URL: https://api.openai.com/v1
LLM_MODEL: gpt-4o-mini
LLM_MODEL_HIGH: gpt-4o-mini
LLM_ROUTER_ENABLED: "false"
LLM_SHADOW: "false"
LLM_LIGHT_MODEL: gpt-6-luna
LLM_MAIN_MODEL: gpt-6.1-sol
LLM_DEEP_MODEL: gpt-6.1-sol
FX_INR_PER_USD: "96.5"
LLM_DAILY_CAP_INR: "300"
LLM_STAGE_SHARPEN: "false"
LLM_STAGE_WHYLINES: "false"
LLM_STAGE_RERANK: "false"
LLM_STAGE_PLAN_A: "false"
LLM_STAGE_PLAN_B: "false"
LLM_STAGE_WHATIF: "false"
IDEA_PIPELINE_ENABLED: "true"
GYANWIRE_NEWS_RULES_CAP: "100"
APP_JOBS_ENABLED: "true"
APP_CORS_ALLOWED_ORIGIN_PATTERNS: https://*,http://localhost:*
