# Non-secret Cloud Run env vars for Gyanwire (Spring Boot gyanwire-server).
# Secrets come from Secret Manager via cloudbuild.yaml --set-secrets.
#
# After first deploy, set UI_ORIGIN to the Cloud Run / Firebase URL if cookies/CORS need it.

APP_PERSISTENCE_PROVIDER: postgres
AUTH_COOKIE_SECURE: "true"
AUTH_COOKIE_SAME_SITE: Lax
JWT_ACCESS_TTL_SECONDS: "43200"
JWT_REFRESH_TTL_SECONDS: "2592000"
LLM_BASE_URL: https://api.openai.com/v1
LLM_MODEL: gpt-4o-mini
APP_CORS_ALLOWED_ORIGIN_PATTERNS: https://*,http://localhost:*
