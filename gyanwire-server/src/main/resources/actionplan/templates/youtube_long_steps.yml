steps:
  - id: s1
    order: 1
    title: Outline, thumbnail, title, and description
    startMin: 0
    durationMin: 70
    paidDurationMin: 35
    paidToolId: chatgpt_plus
    action: "Write chapter outline, a curiosity thumbnail, a ≤100-char title with hashtag, and a ≤5000-char description (What/Why/Studies/Myth/What not to do)."
    input: "NewsBrief + video research sources + product"
    output: "outline.md + thumb.png + title + description.md"
    doneWhen: "5 chapter titles; readable thumb; title ≤100 chars; description pasted"
    toolId: notes_app
    altToolId: gimp
    ifStuck: "Use filled micro-steps as-is; only crop the thumbnail."
    platforms: [youtube]
    scalable: false

  - id: s2
    order: 2
    title: Script the spoken parts
    startMin: 70
    durationMin: 60
    paidDurationMin: 30
    paidToolId: chatgpt_plus
    action: "Write the spoken script minute-by-minute (intro, curiosity, facts, demo, CTA). Target 900–1500 words."
    input: "outline.md + description.md"
    output: "script.md"
    doneWhen: "Word count in range; every minute has spoken lines"
    toolId: text_editor
    altToolId: notes_app
    ifStuck: "Read the filled minute blocks aloud and type what you said."
    platforms: [youtube]
    scalable: true

  - id: s3
    order: 3
    title: Record screen + voice
    startMin: 130
    durationMin: 90
    paidDurationMin: 50
    paidToolId: descript
    action: "Record the product demo with OBS + voice. Keep takes under 12 minutes."
    input: "script.md"
    output: "raw_demo.mkv"
    doneWhen: "Demo section is complete without major pauses"
    toolId: obs_studio
    altToolId: audacity
    ifStuck: "Record demo first, voice-over second."
    platforms: [youtube]
    scalable: true

  - id: s4
    order: 4
    title: Edit and captions
    startMin: 220
    durationMin: 120
    paidDurationMin: 60
    paidToolId: descript
    action: "Cut dead air, add chapter markers, burn captions, export 1080p."
    input: "raw_demo.mkv"
    output: "final.mp4"
    doneWhen: "≤10 min; captions on; chapters set"
    toolId: shotcut
    altToolId: kdenlive
    captionToolId: whisper_cpp
    ifStuck: "Export without fancy transitions."
    platforms: [youtube]
    scalable: true

  - id: s5
    order: 5
    title: Upload and measure
    startMin: 340
    durationMin: 30
    paidDurationMin: 15
    paidToolId: buffer
    action: "Upload to YouTube with title, description, and thumb from step 1. Reminder +48 h for AVD."
    input: "final.mp4 + thumb.png + title + description.md"
    output: "live link + reminder"
    doneWhen: "Video public or scheduled; reminder set"
    toolId: youtube_app
    altToolId: calendar_app
    ifStuck: "Unlisted first, then public."
    platforms: [youtube]
    scalable: false
