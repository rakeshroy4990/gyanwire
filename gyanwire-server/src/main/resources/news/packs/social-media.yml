industry: Social Media
allow_domains:
  - medianama.com
  - inc42.com
  - livemint.com
  - theverge.com
  - techcrunch.com
  - blog.youtube
  - about.fb.com
  - blog.instagram.com
  - blog.linkedin.com
  - blog.x.com
# Must name a platform or social product — blocks cars, lawsuits, and general tech on shared domains.
require_keywords:
  - social media
  - social network
  - social app
  - social platform
  - social commerce
  - social shopping
  - creator economy
  - creator fund
  - creator tools
  - creator platform
  - content creator
  - influencer
  - short video
  - youtube shorts
  - community guidelines
  - content moderation
  - intermediary
  - it rules
  - meity
  - instagram
  - facebook
  - whatsapp
  - youtube
  - tiktok
  - linkedin
  - twitter
  - snapchat
  - threads
  - reddit
  - discord
  - telegram
  - reels
  - shorts
  - meta
  - x corp
require_signal_match: true
deny:
  domains: []
  keywords:
    - celebrity
    - arrested
    - match score
    - horoscope today
    - gossip
    - break up
signals:
  launch: [launches, introduces, rolls out, announces, unveils]
  money: [pricing, free tier, funding, raises, acquires, monetisation, ads]
  rule: [regulation, ban, guidelines, mandate, policy, IT rules]
  pain: [shortage, outage, complaint, backlash, cost, shadowban]
  tool: [API, open-source, SDK, plugin, model, creator]
