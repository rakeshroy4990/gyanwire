app.persistence.provider=${APP_PERSISTENCE_PROVIDER:postgres}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gyanwire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gyanwire}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gyanwire}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.table=gyanwire_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Keeps startup working after intentional fixes to already-applied migrations (e.g. V2 legacy users).
spring.flyway.repair-on-migrate=true

# Cloud Run sets PORT; local bootRun uses GYANWIRE_SERVER_PORT (default 8080).
server.port=${PORT:${GYANWIRE_SERVER_PORT:8080}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
app.ui.origin=${UI_ORIGIN:http://localhost:5180}

app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:${JWT_SECRET:change-me-to-a-long-random-secret}}
app.auth.jwt.access-expiration-seconds=${JWT_ACCESS_TTL_SECONDS:43200}
app.auth.jwt.refresh-expiration-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
app.auth.cookie.access-token-name=access_token
app.auth.cookie.refresh-token-name=refresh_token
app.auth.cookie.refresh-path=/api/auth

app.llm.api-key=${LLM_API_KEY:}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.model-high=${LLM_MODEL_HIGH:${LLM_MODEL:gpt-4o-mini}}
app.llm.router-enabled=${LLM_ROUTER_ENABLED:false}
app.llm.shadow=${LLM_SHADOW:false}
app.llm.fx-inr-per-usd=${FX_INR_PER_USD:96.5}
app.llm.daily-spend-cap-inr=${LLM_DAILY_CAP_INR:300}
app.llm.light-model=${LLM_LIGHT_MODEL:gpt-6-luna}
app.llm.main-model=${LLM_MAIN_MODEL:gpt-6.1-sol}
app.llm.deep-model=${LLM_DEEP_MODEL:gpt-6.1-sol}
app.llm.stage.sharpen=${LLM_STAGE_SHARPEN:false}
app.llm.stage.whylines=${LLM_STAGE_WHYLINES:false}
app.llm.stage.rerank=${LLM_STAGE_RERANK:false}
app.llm.stage.plan-a=${LLM_STAGE_PLAN_A:false}
app.llm.stage.plan-b=${LLM_STAGE_PLAN_B:false}
app.llm.stage.whatif=${LLM_STAGE_WHATIF:false}
app.llm.stage.news-classify=${LLM_STAGE_NEWS_CLASSIFY:false}

gyanwire.news.ingest.enabled=${GYANWIRE_NEWS_INGEST_ENABLED:true}
gyanwire.news.ingest.on-startup=${GYANWIRE_NEWS_INGEST_ON_STARTUP:false}
gyanwire.news.ingest.initial-delay=${GYANWIRE_NEWS_INGEST_INITIAL_DELAY:PT5M}
gyanwire.news.ingest.interval=${GYANWIRE_NEWS_INGEST_INTERVAL:PT30M}
gyanwire.news.ingest.poll-interval-minutes=${GYANWIRE_NEWS_POLL_MINUTES:30}
gyanwire.news.ingest.max-sources-per-industry=${GYANWIRE_NEWS_MAX_SOURCES:0}
gyanwire.news.ingest.connect-timeout-ms=${GYANWIRE_NEWS_CONNECT_TIMEOUT_MS:8000}
gyanwire.news.ingest.read-timeout-ms=${GYANWIRE_NEWS_READ_TIMEOUT_MS:12000}
gyanwire.news.ingest.redirect-timeout-ms=${GYANWIRE_NEWS_REDIRECT_TIMEOUT_MS:4000}
gyanwire.news.ingest.host-spacing-ms=${GYANWIRE_NEWS_HOST_SPACING_MS:1000}
gyanwire.news.ingest.on-demand-timeout-seconds=${GYANWIRE_NEWS_ON_DEMAND_TIMEOUT_SECONDS:12}
gyanwire.news.classify.llm=${GYANWIRE_NEWS_CLASSIFY_LLM:false}
gyanwire.news.rank.windows=${GYANWIRE_NEWS_WINDOWS:14,30,60}
gyanwire.news.rank.min-score=${GYANWIRE_NEWS_MIN_SCORE:40}
gyanwire.news.rank.rules-cap=${GYANWIRE_NEWS_RULES_CAP:55}
gyanwire.news.rank.cache-seconds=${GYANWIRE_NEWS_CACHE_SECONDS:60}
gyanwire.news.alert.median-age-days=${GYANWIRE_NEWS_ALERT_MEDIAN_AGE_DAYS:10}
gyanwire.news.alert.failure-streak=${GYANWIRE_NEWS_ALERT_FAILURE_STREAK:3}
gyanwire.news.seed.allowed=${GYANWIRE_NEWS_SEED_ALLOWED:false}
gyanwire.news.seed.on-empty=${GYANWIRE_NEWS_SEED_ON_EMPTY:false}
gyanwire.news.jobs.enabled=${GYANWIRE_NEWS_JOBS_ENABLED:false}
app.searxng.url=${SEARXNG_URL:}

app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.plan.pro.monthly=${RAZORPAY_PLAN_PRO_MONTHLY:}
app.razorpay.plan.pro.annual=${RAZORPAY_PLAN_PRO_ANNUAL:}
app.razorpay.plan.team.monthly=${RAZORPAY_PLAN_TEAM_MONTHLY:}
app.razorpay.plan.team.annual=${RAZORPAY_PLAN_TEAM_ANNUAL:}
app.razorpay.plan.student.monthly=${RAZORPAY_PLAN_STUDENT_MONTHLY:}

app.rank.hybrid=${APP_RANK_HYBRID:true}
app.jobs.enabled=${APP_JOBS_ENABLED:false}
app.jobs.owner=${APP_JOBS_OWNER:gyanwire}
app.mcp.api-key=${MCP_API_KEY:}
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}

logging.level.com.gyanwire=${APP_LOG_LEVEL:INFO}

spring.web.resources.static-locations=classpath:/static/,file:./dist/,file:../dist/
spring.web.resources.add-mappings=true
