app.persistence.provider=${APP_PERSISTENCE_PROVIDER:postgres}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gyanwire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gyanwire}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gyanwire}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.table=gyanwire_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Cloud Run sets PORT; local bootRun uses GYANWIRE_SERVER_PORT (default 8080).
server.port=${PORT:${GYANWIRE_SERVER_PORT:8080}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
app.ui.origin=${UI_ORIGIN:http://localhost:5180}

app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:${JWT_SECRET:change-me-to-a-long-random-secret}}
app.auth.jwt.access-expiration-seconds=${JWT_ACCESS_TTL_SECONDS:43200}
app.auth.jwt.refresh-expiration-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
app.auth.cookie.access-token-name=access_token
app.auth.cookie.refresh-token-name=refresh_token
app.auth.cookie.refresh-path=/api/auth

app.llm.api-key=${LLM_API_KEY:}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.searxng.url=${SEARXNG_URL:}

app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.plan.pro.monthly=${RAZORPAY_PLAN_PRO_MONTHLY:}
app.razorpay.plan.pro.annual=${RAZORPAY_PLAN_PRO_ANNUAL:}
app.razorpay.plan.team.monthly=${RAZORPAY_PLAN_TEAM_MONTHLY:}
app.razorpay.plan.team.annual=${RAZORPAY_PLAN_TEAM_ANNUAL:}
app.razorpay.plan.student.monthly=${RAZORPAY_PLAN_STUDENT_MONTHLY:}

app.rank.hybrid=${APP_RANK_HYBRID:true}
app.jobs.enabled=${APP_JOBS_ENABLED:false}
app.jobs.owner=${APP_JOBS_OWNER:gyanwire}
app.mcp.api-key=${MCP_API_KEY:}
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}

logging.level.com.gyanwire=${APP_LOG_LEVEL:INFO}

spring.web.resources.static-locations=classpath:/static/,file:./dist/,file:../dist/
spring.web.resources.add-mappings=true
